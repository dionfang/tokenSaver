<!doctype html>
<!-- 在线安装/首次配置向导(§5.5 五步,M2):全部走 preload 白名单通道(window.trayWizard),渲染进程零 Node。
     文案全汉字;运行模式只显示「cpu模型/gpu模型」。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TokenSaver 安装向导</title>
<style>
  :root { --line: #d8d8d8; --ok: #1a7f37; --warn: #b58900; --err: #c0392b; }
  * { box-sizing: border-box; }
  body { font: 13px/1.6 "Microsoft YaHei", system-ui, sans-serif; margin: 0; padding: 14px 18px 18px; color: #222; overflow: hidden; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 12px; margin-bottom: 10px; }
  .steps { display: flex; gap: 6px; margin-bottom: 12px; }
  .steps span { flex: 1; text-align: center; padding: 4px 0; border-bottom: 3px solid #eee; color: #999; font-size: 12px; }
  .steps span.on { border-color: #2f6fdf; color: #2f6fdf; font-weight: bold; }
  .steps span.done { border-color: var(--ok); color: var(--ok); }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  button { padding: 6px 16px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
  button.primary { background: #2f6fdf; border-color: #2f6fdf; color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.link { border: none; background: none; color: #2f6fdf; padding: 0; text-decoration: underline; }
  ul.roots { list-style: none; padding: 0; margin: 8px 0; max-height: 130px; overflow: auto; }
  ul.roots li { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #e2e2e2; padding: 3px 2px; }
  .hint { font-size: 12px; color: var(--warn); }
  .ok { color: var(--ok); } .err { color: var(--err); }
  .lamp { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .lamp.green { background: #22c55e; } .lamp.red { background: #ef4444; } .lamp.absent { background: #cbd5e1; }
  label.mode { display: block; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; cursor: pointer; }
  label.mode input { margin-right: 8px; }
  .bar { height: 14px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: #f6f6f6; }
  .bar > i { display: block; height: 100%; background: #2f6fdf; width: 0; transition: width .2s; }
  .item { margin: 8px 0; }
  .item .meta { display: flex; justify-content: space-between; font-size: 12px; color: #555; }
  .disc { font-size: 12px; color: #555; background: #f8f8f8; border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
  .disc b { color: #333; }
  pre.stderr { background: #2d2d2d; color: #f66; padding: 8px; border-radius: 6px; max-height: 110px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  pre.cmdlog { background: #0d1117; color: #9fd49f; padding: 8px; border-radius: 6px; max-height: 150px; overflow-y: auto; font-size: 11px; white-space: pre-wrap; font-family: Consolas, monospace; }
  .bar.stripes > i { background: repeating-linear-gradient(45deg, #58a6ff, #58a6ff 8px, #79b8ff 8px, #79b8ff 16px); animation: slide 1s linear infinite; background-size: 32px 100%; }
  @keyframes slide { from { background-position: 0 0; } to { background-position: 32px 0; } }
  .nav { display: flex; justify-content: space-between; margin-top: 6px; }
</style>
</head>
<body>
<h1>TokenSaver 在线安装 / 首次配置</h1>
<div class="sub" id="subtitle">按步骤完成安装;中途退出会记住进度,下次打开继续。</div>
<div class="steps" id="steps"></div>
<div id="body"></div>
<div class="nav">
  <button id="btnBack">上一步</button>
  <button id="btnRecheck" onclick="act('start-env-check')" style="display:none">重新自检</button>
  <button id="btnNext" class="primary">下一步</button>
</div>

<script>
const STEPS = [
  ['ROOTS', '索引目录'], ['MODE', '运行模式'], ['ENVCHECK', '环境自检'],
  ['CONSENT', '数据上传'], ['INIT_RUN', '安装接线'],
];
const S = { w: null, progress: null, hooks: null, nodeForm: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 动作错误可见化(2026-11-15):invoke 失败不再静默——右下角浮条显示原因,避免「按钮点了没反应」无从排查
const act = (name, payload) => window.trayWizard.action(name, payload)
  .then((r) => { render(); if (r && r.ok === false) showErr(r.message || r.error || '未知错误'); else if (r && r.ok === true && r.message) showOk(r.message); return r; })
  .catch((e) => { showErr(String((e && e.message) || e)); throw e; });
function showErr(msg) {
  let el = document.getElementById('errline');
  if (!el) { el = document.createElement('div'); el.id = 'errline'; el.style.cssText = 'position:fixed;right:12px;bottom:12px;max-width:70%;background:#7f1d1d;color:#fecaca;padding:8px 12px;border-radius:6px;font-size:12px;z-index:99'; document.body.appendChild(el); }
  el.textContent = `动作失败:${msg}`;
  clearTimeout(el._t); el._t = setTimeout(() => el.remove(), 30000);
}
function showOk(msg) {
  let el = document.getElementById('okline');
  if (!el) { el = document.createElement('div'); el.id = 'okline'; el.style.cssText = 'position:fixed;right:12px;bottom:12px;max-width:70%;background:#14532d;color:#bbf7d0;padding:8px 12px;border-radius:6px;font-size:12px;z-index:99'; document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(el._t); el._t = setTimeout(() => el.remove(), 8000);
}
// 2026-11-16 修复:模板内联 onclick="act(...)" 只能在 window 作用域解析,而 act 是 const(全局词法绑定不挂 window)
// → 向导内所有内联按钮静默失效(ReferenceError,点了毫无反应)。显式挂 window.act 修复(勿改回 const-only)。
window.act = act;

window.trayWizard.onState((st) => {
  // 显式逐字段直赋(2026-11-15 修复):Object.assign(S, st) 在沙箱渲染上下文不生效,曾致 S.w 恒 null、按钮误显「加载中」
  S.w = st ? st.wizard : null;
  S.progress = st ? st.progress : null;
  S.hooks = st ? st.hooks : null;
  S.nodeForm = st ? st.nodeForm : null;
  S.ollamaVersion = st ? st.ollamaVersion : null;
  S.ollamaSetup = st ? st.ollamaSetup : null;
  S.installing = st ? st.installing : null;      // 软项自动安装(2026-11-16):deps/weights
  S.installLog = st ? st.installLog : null;     // CMD 滚动日志(尾部)
  S.checking = st ? st.checking : null;         // 自检进行中(2026-11-16):按钮禁用+检测中反馈
  S.pullProgress = st ? st.pullProgress : null; // pull 真百分比
  S.downloading = !!(st && st.downloading);
  render();
});

function stepIndex(status) {
  if (status === 'INIT') return -1;
  if (status === 'DONE') return STEPS.length;
  return STEPS.findIndex(([k]) => k === status);
}

function render() {
  const w = S.w || { status: 'INIT', roots: [], downloads: {} };
  const cur = stepIndex(w.status);
  $('steps').innerHTML = STEPS.map(([k, label], i) =>
    `<span class="${i < cur ? 'done' : i === cur ? 'on' : ''}">${i + 1}. ${label}</span>`).join('');
  $('btnBack').disabled = cur <= 0 || w.status === 'DONE';
  $('btnBack').style.visibility = w.status === 'DONE' ? 'hidden' : 'visible';
  const gate = nextGate(w);
  // 2026-11-15 修复:load 推送到达前按钮禁用(S.w=null 时点击会被旧逻辑静默吞掉——加载竞态)
  // 2026-11-16:安装/拉取/自检/接线进行中一律禁下一步(接线自动驱动,完成自动跳 DONE)
  const initRunning = w.status === 'INIT_RUN' && !w.lastError;
  $('btnNext').disabled = !!S.installing || !!S.checking || initRunning || !S.w || !gate.ok;
  $('btnNext').textContent = !S.w ? '加载中…' : (S.installing ? '安装中…' : (S.checking ? '检测中…' : (initRunning ? '正在接线…' : (w.status === 'DONE' ? '已完成' : (w.status === 'INIT_RUN' ? '正在接线…' : '下一步')))));
  const rc = $('btnRecheck'); if (rc) { rc.style.display = w.status === 'ENVCHECK' ? '' : 'none'; rc.disabled = !!S.installing || !!S.checking; rc.textContent = S.checking ? '检测中…' : '重新自检'; } // 重新自检仅 ENVCHECK 步显示于导航
  if (w.status === 'INIT') {
    $('body').innerHTML = '<div class="card"><b>欢迎使用 TokenSaver。</b><br>本向导将完成:选择要语义索引的目录 → 选择运行模式(cpu模型/gpu模型) → 数据上传同意 → 环境自检 → 安装接线(写入所选目录的工具说明段并配置 IDE 钩子)。<div class="hint" style="margin-top:8px">不索引任何目录也可以完成安装(只装工具与钩子)。</div></div>';
    return;
  }
  if (w.status === 'ROOTS') renderRoots(w);
  else if (w.status === 'MODE') renderMode(w);
  else if (w.status === 'CONSENT') renderConsent(w);
  else if (w.status === 'ENVCHECK') renderEnvCheck(w);
  else if (w.status === 'INIT_RUN') renderInitRun(w);
  else if (w.status === 'DONE') renderDone(w);
}

// —— 下一步可用性(与主进程 fsm 守卫同口径;按钮禁用只是 UI 前置,真守卫在 fsm) ——
function nextGate(w) {
  if (w.status === 'INIT' || w.status === 'ROOTS' || w.status === 'CONSENT') return { ok: true };
  if (w.status === 'MODE') return (w.runMode === 'cpu' || (w.runMode === 'gpu' && w.ollamaReady === true)) ? { ok: true } : { ok: false };
  if (w.status === 'ENVCHECK') {
    const checks = w.envChecks || [];
    return checks.length && checks.every((c) => c.ok || !c.hard) ? { ok: true } : { ok: false };
  }
  return { ok: false };
}

function renderRoots(w) {
  const rows = (w.roots || []).map((r) =>
    `<li><span>${esc(r)}</span><button class="link" onclick="act('remove-root',{dir:${JSON.stringify(r).replace(/"/g, '&quot;')}})">移除</button></li>`).join('');
  const n = (w.roots || []).length;
  $('body').innerHTML = `
    <div class="card">
      <b>要语义索引哪些目录?</b>
      <div class="row"><button onclick="act('pick-roots')">选择目录…</button><span class="sub">可反复添加,不设个数上限</span></div>
      <ul class="roots">${rows || '<li class="sub">尚未选择目录</li>'}</ul>
      ${n ? `<div class="hint">已载入 ${n} 个目录(来自现有配置,可增删);点「下一步」后重新接线时将<b>整表替换</b>索引目录(移除即生效)。</div>` : ''}
      ${n === 0 ? '<div class="hint">未选目录:语义检索暂不可用,可稍后在托盘添加。不索引也可完成安装(只装工具与钩子)。</div>' : ''}
    </div>`;
}

function renderMode(w) {
  const gpuReady = w.ollamaReady === true;
  $('body').innerHTML = `
    <div class="card">
      <b>运行模式</b>
      <label class="mode"><input type="radio" name="mode" ${w.runMode === 'cpu' ? 'checked' : ''} onchange="act('set-mode',{mode:'cpu'})"> cpu模型<span class="sub">—— 本机常驻推理,不依赖 Ollama(权重由向导下载)</span></label>
      <label class="mode"><input type="radio" name="mode" ${w.runMode === 'gpu' ? 'checked' : ''} onchange="act('set-mode',{mode:'gpu'})"> gpu模型<span class="sub">—— 使用本机 Ollama(可走 GPU)。需要本机 Ollama(请自行下载安装)</span></label>
      ${w.runMode === 'gpu' ? `
      <div class="disc">
        <div id="ollamaState">${gpuReady ? '<span class="ok">✔ 已检测到 Ollama 服务' + (S.ollamaVersion ? '(版本 ' + esc(S.ollamaVersion) + ')' : '') + '</span>' : '<span class="err">✘ 未检测到 Ollama 服务在运行(gpu模型 必须先就绪才能继续)</span>'}</div>
        <div class="row">
          <button onclick="act('recheck-ollama')">我已装好,重新检测</button>
        </div>
        <div class="sub">请下载并安装启动 Ollama 服务后再点「重新检测」,推荐安装 Ollama 0.40.15。</div>
      </div>` : ''}
    </div>`;
}

function renderConsent(w) {
  const checked = w.consent === true;
  $('body').innerHTML = `
    <div class="card">
      <b>数据上传同意(可跳过)</b>
      <div class="row" style="margin-top:10px">
        <label><input type="checkbox" id="ckConsent" ${checked ? 'checked' : ''} onchange="act('set-consent',{checked:this.checked})"> 同意上传本地向量 KNN 数据</label>
      </div>
      <div class="disc">
        <b>勾选的后果:</b>① 向服务器上传本地向量 KNN 数据用于扩容公共决策池(其中<b>不含本地项目代码/业务数据</b>);② 解锁「更新 base 向量」(从服务器下载公共决策向量包)。<br>
        <b>跳过的后果:</b>不上传,同时「更新 base 向量」功能禁用(按钮置灰),决策向量仅使用本机数据——互惠条款:不向服务器池贡献,也不从池受益。<br><br>
        另外,无论是否同意,安装接线都会<b>向所选目录的 AGENTS.md 写入工具说明段,并配置 IDE 用户级钩子</b>(可随时用托盘的「修复钩子」/卸载功能移除)。<br><br>
        同意状态<b>可随时在设置中撤回</b>。
      </div>
    </div>`;
}

function phaseText(p) {
  return { fetching: '下载中', resume: '续传中', verify: '校验中', pull: '拉取中', done: '完成' }[p?.phase] || '';
}
function bytes(n) { return n == null ? '' : n >= 1 << 30 ? (n / (1 << 30)).toFixed(2) + ' GB' : n >= 1 << 20 ? (n / (1 << 20)).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB'; }

function renderEnvCheck(w) {
  const checks = w.envChecks || [];
  const hardBad = checks.filter((c) => c.hard && c.ok !== true);
  const rows = checks.length ? checks.map((c) => `
    <div class="item"><div class="meta"><span>${esc(c.label)}</span>
      <span class="${c.ok ? 'ok' : (c.hard ? 'err' : 'sub')}">${c.ok ? '✔' : (c.hard ? '✘' : '待补')}${c.hint ? ' — ' + esc(c.hint) : ''}</span>
    </div></div>`).join('') : '<div class="sub">正在检测环境…</div>';
  const installing = S.installing;
  const log = (S.installLog || []).slice(-30).map(esc).join('\n');
  $('body').innerHTML = `
    <div class="card">
      <b>环境自检</b><span class="sub">(检测本机是否具备安装条件;缺项自动安装,CMD 滚动显示进度)</span>
      ${rows}
      ${hardBad.length ? `<div class="err">请先补齐硬性缺项:${esc(hardBad.map((c) => c.label).join(', '))}</div>` : ''}
      ${installing ? (() => {
        // 2026-11-16 修复:controller 写入的是 installing='pull:<模型名>'(带名字),字面 'pull' 判断恒 false→误显 cpu 文案
        const isPull = String(installing).startsWith('pull');
        const pp = S.pullProgress;
        const title = isPull
          ? (pp ? `正在自动拉取 Ollama 模型:${esc(pp.model)}(${pp.pct}%)` : '正在自动拉取 Ollama 模型…')
          : installing === 'deps' ? '正在自动安装:推理依赖(npm install)…'
          : '正在自动安装:cpu 模式权重(HuggingFace → hf-cache)…';
        const width = isPull ? (pp ? pp.pct : 100) : 100;
        const full = isPull ? (pp != null && pp.pct >= 100) : true;
        return `<div class="sub">${title}</div>
      <div class="bar"><i class="${full ? 'full' : ''}" style="width:${width}%"></i></div>
      <pre class="stderr" id="cmdlog">${log || '等待输出…'}</pre>`;
      })() : ''}
      ${installing ? '<div class="sub">安装中,完成后自动重新自检</div>' : ''}
      <div class="sub">自检通过后即可进入安装接线(init 现场组装:deps 缺失自动 npm install,cpu 权重缺失自动下载到 hf-cache)。</div>
    </div>`;
  // 2026-11-16 用户裁决:「重新自检」挪到底部导航(上一步|重新自检|下一步);checking/installing 均禁用
  const rc = $('btnRecheck');
  if (rc) { rc.style.display = ''; rc.disabled = !!installing || !!S.checking; rc.textContent = S.checking ? '检测中…' : '重新自检'; }
  const cl = $('cmdlog'); if (cl) cl.scrollTop = cl.scrollHeight;
  // renderEnvCheck 局部不再覆盖按钮(统一走 render() 的 checking/installing 状态,防文案打架)
  // 进入本步自动跑一次自检(结果到达后 onState 重渲染;S.envChecking 本地标志防重入)
  if (!checks.length && !S.envChecking) { S.envChecking = true; act('start-env-check').finally(() => { S.envChecking = false; }); }
}

function renderInitRun(w) {
  const logs = (w.initLog || []).map((l) => `<li>${esc(l.label)} — ${l.code === 0 ? '<span class="ok">成功</span>' : '<span class="err">失败</span>'}</li>`).join('');
  const running = !w.initLog?.length && !w.lastError && w.status === 'INIT_RUN';
  $('body').innerHTML = `
    <div class="card">
      <b>安装接线</b>
      <div class="sub">逐目录执行 init 接线(写入 AGENTS.md 工具说明段+配置 IDE 用户级钩子+设置运行模式)。roots 为空时只设置运行模式。</div>
      <ul>${logs || (running ? '<li class="sub">正在接线…</li>' : '<li class="sub">尚未开始</li>')}</ul>
      ${w.lastError ? `<pre class="stderr">${esc(w.lastError)}</pre><div class="row"><button onclick="act('run-init')">重试接线</button></div>` : ''}
    </div>`;
  // 2026-11-16 用户裁决:接线自动驱动——进入 INIT_RUN 即自动执行,删除「执行安装接线」按钮(仅失败时保留重试)
  if (running && !S.initRunning) { S.initRunning = true; act('run-init').finally(() => { S.initRunning = false; }); }
}

function renderDone(w) {
  const hooks = S.hooks;
  const lamp = (h) => `<span class="lamp ${(h && h.state) || 'absent'}"></span>`;
  $('body').innerHTML = `
    <div class="card">
      <b class="ok">✔ 安装完成!</b>
      <div class="sub">索引目录:${(w.roots || []).length} 个;运行模式:${w.runMode === 'gpu' ? 'gpu模型' : 'cpu模型'};数据上传:${w.consent ? '已同意' : '未同意(更新 base 向量已禁用,仅使用本机 KNN)'}。</div>
      ${hooks ? `<div class="row">
        <span>${lamp(hooks.zcode)} ZCode 钩子</span><span>${lamp(hooks.cursor)} Cursor 钩子</span><span>${lamp(hooks.qoder)} Qoder 钩子</span>
      </div><div class="sub">钩子灯异常时可用托盘菜单「修复钩子」。若刚接入下载的 Node 运行时,已打开的 IDE 需重启后钩子生效。</div>` : ''}
      <div class="sub">托盘常驻后台;双击托盘图标可查看状态面板;需要换目录/换模式时重开安装向导即可(第 1 步自动载入现有配置)。</div>
    </div>`;
  const btn = $('btnNext'); btn.textContent = '完成'; btn.disabled = false;
  btn.onclick = () => window.close();
}

$('btnBack').onclick = () => act('back');
$('btnNext').onclick = () => {
  const w = S.w;
  if (!w) { act('load'); return; } // 加载竞态兜底:状态未至则重发 load(按钮正常态下不会走这)
  if (w.status === 'DONE') { window.close(); return; }
  act('next');
};
act('load');
</script>
</body>
</html>

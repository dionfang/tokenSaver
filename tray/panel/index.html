<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>TokenSaver 状态面板</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.6 "Microsoft YaHei", system-ui, sans-serif; background: #161b22; color: #c9d1d9; padding: 14px 16px; overflow: hidden; }
  h2 { font-size: 12px; color: #8b949e; font-weight: 600; margin: 14px 0 6px; border-bottom: 1px solid #21262d; padding-bottom: 4px; }
  h2.section-title:first-of-type { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .green { background: #3fb950; box-shadow: 0 0 6px #3fb95088; }
  .yellow { background: #d29922; box-shadow: 0 0 6px #d2992288; }
  .red { background: #f85149; box-shadow: 0 0 6px #f8514988; }
  .absent, .empty { background: #6e7681; }
  .name { flex: 1; }
  .state { color: #8b949e; font-size: 12px; }
  .note { color: #d29922; font-size: 12px; padding: 2px 0 0 18px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; }
  .bar { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; flex: 1; }
  .bar > i { display: block; height: 100%; background: #d29922; width: 0; transition: width .4s; }  /* 2026-11-15:默认黄=未满;满则加 .full 转绿 */
  .bar > i.full { background: #3fb950; }
  .bar > i.grey { background: #6e7681; }  /* 公共决策包未下载=灰(2026-11-15) */
  .pct { font-size: 12px; color: #8b949e; flex: none; min-width: 34px; text-align: right; }
  .lbl { font-size: 12px; color: #8b949e; flex: none; min-width: 88px; }
  #mode { color: #58a6ff; }
  .section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .head-btn {
    appearance: none; font: 12px/20px "Microsoft YaHei", system-ui, sans-serif;
    color: #c9d1d9; background: #21262d; border: 1px solid #30363d; border-radius: 4px;
    padding: 0 10px; cursor: pointer;
  }
  .head-btn:hover:not(:disabled) { border-color: #58a6ff; color: #58a6ff; }
  .head-btn:disabled { opacity: 0.55; cursor: default; }
</style>
</head>
<body>
  <h2 class="section-title">模型启动状态 <button type="button" id="snap-refresh" class="head-btn">刷新</button></h2>
  <div class="row"><span class="name">运行模式</span><span id="mode">检测中</span></div>
  <div class="row"><span class="dot" id="m-embedding"></span><span class="name">嵌入模型</span><span class="state" id="t-embedding">检测中</span></div>
  <div class="row"><span class="dot" id="m-reranker"></span><span class="name">精排模型</span><span class="state" id="t-reranker">检测中</span></div>
  <div class="row"><span class="dot" id="m-decision"></span><span class="name">决策模型</span><span class="state" id="t-decision">检测中</span></div>

  <h2 class="section-title">代码索引状态 <button type="button" id="embed-sync" class="head-btn">立即同步</button></h2>
  <div class="row"><span class="dot" id="m-embed"></span><span class="name">向量嵌入</span><span class="state" id="t-embed">检测中</span></div>
  <div class="bar-row"><div class="bar"><i id="embed-bar"></i></div><span class="pct" id="embed-pct">100%</span></div>

  <h2 class="section-title">模型决策状态 <span style="display:flex;gap:6px"><button type="button" id="base-update" class="head-btn">更新</button><button type="button" id="knn-sync" class="head-btn">立即同步</button></span></h2>
  <div class="row"><span class="dot" id="m-knn"></span><span class="name" id="knn-name">模型决策状态</span><span class="state" id="t-knn">检测中</span></div>
  <div class="bar-row"><span class="lbl">本地决策包</span><div class="bar"><i id="knn-bar"></i></div><span class="pct" id="knn-pct">—</span></div>
  <div class="bar-row"><span class="lbl">公共决策包</span><div class="bar"><i id="knn-base-bar"></i></div><span class="pct" id="knn-base-pct"></span></div>
  <div class="row"><span class="state" id="base-update-msg" style="flex:1;text-align:right"></span></div>
  <!-- 应用更新专属进度行(20261123 用户裁定):平时隐藏;「检查应用更新」发现新版时显示,下载进度实时刷新,
       不占用公共决策包进度条;完成/失败/安装后隐藏恢复。 -->
  <div class="bar-row" id="app-update-row" style="display:none">
    <div class="bar"><i id="app-update-bar"></i></div><span class="pct" id="app-update-pct"></span>
  </div>

  <h2 class="section-title">三端钩子配置 <button type="button" id="hook-repair" class="head-btn">修复</button></h2>
  <div class="row"><span class="dot" id="m-zcode"></span><span class="name">ZCode</span><span class="state" id="t-zcode">检测中</span></div>
  <div class="row"><span class="dot" id="m-cursor"></span><span class="name">Cursor</span><span class="state" id="t-cursor">检测中</span></div>
  <div class="row"><span class="dot" id="m-qoder"></span><span class="name">Qoder</span><span class="state" id="t-qoder">检测中</span></div>

<script>
  const LAMP_TEXT = { green: '正常', yellow: '未就绪', red: '异常', absent: '未安装', empty: '无内容' };
  const HOOK_TEXT = { green: '接线正确', red: '接线错误', absent: '未安装' };
  const MODEL_TEXT = { green: '已运行', yellow: '未运行', red: '未安装' };
  const EMBED_TEXT = { green: '全量嵌入', yellow: '部分嵌入', red: '无嵌入', empty: '未选目录' };
  // 2026-11-15 用户裁决:启用 base+local=「在线模式」;仅 local=「离线模式」(原名中的 local/base+local 前缀去掉)
  const KNN_TEXT = { green: '在线模式', yellow: '离线模式', red: '离线模式', absent: '未检测' };
  const KNN_NAME = { green: '在线模式', yellow: '离线模式', red: '离线模式', absent: '模型决策状态' };
  const $ = (id) => document.getElementById(id);

  function setLamp(id, lamp, textMap) {
    $(`m-${id}`).className = `dot ${lamp || 'absent'}`;
    $(`t-${id}`).textContent = (textMap || LAMP_TEXT)[lamp] || '未知';
  }

  function render(s) {
    const L = s.lamps || {};
    for (const k of ['embedding', 'reranker', 'decision']) {
      setLamp(k, L.models?.[k], MODEL_TEXT);
      // 2026-11-15:未运行=未驻留显存(Ollama 空闲卸载/未预热),非故障——悬停说明,避免误判
      $(`t-${k}`).title = '「未运行」= 该模型当前未驻留显存:Ollama keep_alive 到期空闲卸载或尚未预热;检索/预热时会自动拉起';
    }
    paintWeightDownload(s.weightDownload || null); // 2026-11-18:下载中显示百分比,替代「未安装」
    $('mode').textContent = s.modelIn === 'local' ? 'cpu模型' : s.modelIn ? 'gpu模型' : '未知';
    setLamp('embed', L.embed, EMBED_TEXT);
    const p = L.detail || {};
    const total = p.embedTotal, done = p.embedDone ?? 0, pct = p.embedPct;
    $('embed-bar').style.width = `${total != null ? (pct ?? 0) : 0}%`;
    $('embed-bar').className = pct != null && pct >= 100 ? 'full' : '';
    // 2026-11-15 用户裁决:总体状态——已嵌/总索引块+总比例;100%=绿条,不足=黄条;下方不显示状态原因文案
    $('embed-pct').textContent = total != null ? `${done}/${total}(${pct ?? 0}%)` : '未选目录';
    setLamp('knn', L.knn, KNN_TEXT);
    $('knn-name').textContent = KNN_NAME[L.knn] || '模型决策状态';
    // 本地决策包(20261120 显示逻辑与公共决策包对齐):无样本库=灰条+「无本地样本」(旧版显示「—」
    // =查不到状态,用户投诉);有样本=同语法 done/total(pct%),100% 绿满条,不足=黄条。
    const kd = p.knnDone ?? 0, kt = p.knnTotal, kpct = p.knnPct;
    $('knn-bar').style.width = `${kt != null ? (kpct ?? 0) : 0}%`;
    $('knn-bar').className = kt == null ? 'grey' : (kpct != null && kpct >= 100 ? 'full' : '');
    $('knn-pct').textContent = kt != null ? `${kd}/${kt}(${kpct ?? 0}%)` : '无本地样本';
    // 公共决策包(原名 base 向量包):未下载=灰条且无文案;已下载=同本地格式「done/total(pct%)」
    // 下载/导入进行中(baseDownloading)由 onBaseEvent 实时驱动进度条,周期快照不覆盖,避免条来回跳。
    const bd = p.knnBaseDone, bt = p.knnBaseTotal, bpct = p.knnBasePct;
    if (!baseDownloading) {
      $('knn-base-bar').style.width = `${bd != null ? (bpct ?? 0) : 0}%`;
      $('knn-base-bar').className = bd == null ? 'grey' : (bpct != null && bpct >= 100 ? 'full' : '');
      $('knn-base-pct').textContent = bd != null && bt != null ? `${bd}/${bt}(${bpct ?? 0}%)` : '';
    }
    for (const k of ['zcode', 'cursor', 'qoder']) setLamp(k, L.hooks?.[k], HOOK_TEXT);
    embedRunning = s.embedPid != null;
    paintSyncBtn();
    consentOn = s.consent?.uploadLocalKnn === true;
    paintBaseBtn();
  }

  // ---------- M4/M5(2026-11-18 交互裁决):「更新」=互惠动作(先上传本地已签向量再下载);
  // 同意唯一入口=安装向导数据上传步,面板保持监控定位(上传/同意开关已删) ----------
  let baseHold = false;
  let baseDownloading = false; // 公共决策包下载/导入进行中:进度条改由 onBaseEvent 驱动,render 暂不覆盖
  let consentOn = false;
  function paintBaseBtn() {
    const btn = $('base-update');
    btn.disabled = baseHold || !consentOn;
    btn.textContent = baseHold ? '更新中' : '更新';
    btn.title = consentOn ? '互惠更新:先上传本地已签向量,再从发行源下载公共决策包' : '未同意上传本地向量(安装向导-数据上传步勾选后可用)';
  }
  function baseMsg(text, kind) {
    const el = $('base-update-msg');
    el.textContent = text || '';
    el.style.color = kind === 'err' ? '#f85149' : kind === 'ok' ? '#3fb950' : '#8b949e';
  }
  // 应用更新专属进度行(20261123):默认隐藏;只有【确认存在新版】才显示——manifest 阶段区分
  // 「检查应用更新…」(检查中,不显示条)与「发现新版本 x,下载中…」(存在新版,显示条);
  // 下载 pct 实时刷新,完成 2s 后隐藏,已是最新/失败即隐藏(绿色文案在 base-update-msg 独立展示)。
  let appUpdateHideTimer = null;
  function paintAppUpdate(ev) {
    const row = $('app-update-row'); if (!row) return;
    const msg = String(ev.message || '');
    const hasNew = ev.phase === 'download' || (ev.phase === 'manifest' && msg.includes('发现新版本'));
    if (hasNew) {
      if (appUpdateHideTimer) { clearTimeout(appUpdateHideTimer); appUpdateHideTimer = null; }
      row.style.display = '';
      const pct = ev.pct;
      $('app-update-bar').style.width = `${pct != null ? pct : 0}%`;
      $('app-update-bar').className = pct != null && pct >= 100 ? 'full' : '';
      $('app-update-pct').textContent = pct != null ? `${pct}%` : '…';
      return;
    }
    // 检查中(manifest「检查应用更新…」)→ 保持隐藏,不显示空条
    if (ev.phase === 'manifest') return;
    if (ev.phase === 'result' || ev.phase === 'done') {
      const ok = ev.outcome === 'updated' || ev.outcome === 'installing'; // already-latest 不显条(绿文案即够,hasNew 门统一口径)
      if (ok) {
        $('app-update-bar').style.width = '100%';
        $('app-update-bar').className = 'full';
        $('app-update-pct').textContent = '';
        appUpdateHideTimer = setTimeout(() => { row.style.display = 'none'; appUpdateHideTimer = null; }, 2000);
      } else {
        row.style.display = 'none'; // 失败即隐藏,错误经 base-update-msg 红字展示
      }
    }
  }
  window.trayPanel?.onBaseEvent((ev) => {
    // 20261123 修复(用户裁定):kind='app' = 应用更新事件 → 写专属进度行(app-update-row),不碰公共决策包条
    
if (ev.kind === 'app') { paintAppUpdate(ev); return; }
    if (ev.phase === 'consent') { consentOn = ev.consent?.uploadLocalKnn === true; paintBaseBtn(); return; }
    if (ev.phase === 'download') {
      // 下载进度实时上条(此前仅文字行更新,进度条不动=用户报「下载完进度条没对应更新」)
      // 20261123 用户裁定:百分比只在条右侧 pct 一处显示,下方 base-update-msg 行不再重复「下载中 x%」
      baseDownloading = true;
      const pct = ev.pct ?? 0;
      $('knn-base-bar').style.width = `${pct}%`;
      $('knn-base-bar').className = pct >= 100 ? 'full' : '';
      $('knn-base-pct').textContent = ev.pct != null ? `下载中 ${pct}%` : '下载中…';
      return;
    }
    if (ev.phase === 'import') {
      baseDownloading = true; // 下载已满,导入期间条保持满格黄,文案转「导入中」
      $('knn-base-bar').style.width = '100%';
      $('knn-base-bar').className = '';
      $('knn-base-pct').textContent = '导入中…';
      baseMsg(ev.message || '');
      return;
    }
    if (ev.phase === 'manifest') { baseMsg(ev.message || ''); return; }
    if (ev.phase === 'result' || ev.phase === 'done') {
      baseDownloading = false;
      baseHold = false; paintBaseBtn();
      const ok = ev.outcome === 'updated' || ev.outcome === 'installing'; // already-latest 不显条(绿文案即够,hasNew 门统一口径)
      baseMsg(ev.message || '', ok ? 'ok' : 'err');
      // 成功即拉新快照,进度条从下载态转入真实 base 层条数比例(不再等周期 tick/被 slowInFlight 跳过)
      if (ok) window.trayPanel?.refresh?.().catch(() => {});
    }
  });
  $('base-update').addEventListener('click', async () => {
    if (!window.trayPanel?.updateBase || baseHold || !consentOn) return;
    baseHold = true; paintBaseBtn(); baseMsg('互惠更新中:先上传本地向量…');
    try { await window.trayPanel.updateBase(); }
    finally { baseHold = false; paintBaseBtn(); }
  });

  let embedRunning = false;
  let embedHold = false;
  let knnHold = false;
  function paintSyncBtn() {
    const busy = embedRunning || embedHold || knnHold;
    for (const id of ['embed-sync', 'knn-sync']) {
      const btn = $(id);
      if (!btn) continue;
      btn.disabled = busy;
      btn.textContent = busy ? '同步中' : '立即同步';
    }
  }

  window.trayPanel?.onSnapshot(render);
  // 2026-11-18 交互同步:模型下载中显示「下载中 pct%」替代「未安装」(向导权重/托盘自动补/gpu pull 三路)
  function paintWeightDownload(wd) {
    if (!wd) return;
    for (const k of ['embedding', 'reranker', 'decision']) {
      const it = wd[k];
      if (!it) continue;
      const el = $(`t-${k}`);
      if (!el) continue;
      el.textContent = `下载中 ${it.pct != null ? it.pct : 0}%${it.file ? ' · ' + it.file : ''}`;
      el.title = it.phase === 'pull' ? 'Ollama 拉取中' : '权重文件下载中(向导/托盘自动补),完成后自动转绿';
      $(`m-${k}`).className = 'dot yellow';
    }
  }
  window.trayPanel?.onWeightDownload((wd) => paintWeightDownload(wd || null));
  $('snap-refresh').addEventListener('click', async () => {
    const btn = $('snap-refresh');
    if (!window.trayPanel?.refresh || btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '刷新中';
    try { await window.trayPanel.refresh(); }
    finally { btn.disabled = false; btn.textContent = '刷新'; }
  });
  $('embed-sync').addEventListener('click', async () => {
    const btn = $('embed-sync');
    if (!window.trayPanel?.syncEmbed || btn.disabled) return;
    embedHold = true;
    paintSyncBtn();
    try { await window.trayPanel.syncEmbed(); }
    finally { embedHold = false; paintSyncBtn(); }
  });
  $('knn-sync').addEventListener('click', async () => {
    const btn = $('knn-sync');
    if (!window.trayPanel?.syncVectors || btn.disabled) return;
    knnHold = true;
    paintSyncBtn();
    try { await window.trayPanel.syncVectors(); }
    finally { knnHold = false; paintSyncBtn(); }
  });
  $('hook-repair').addEventListener('click', async () => {
    const btn = $('hook-repair');
    if (!window.trayPanel?.repairHooks || btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '修复中';
    try { await window.trayPanel.repairHooks(); }
    finally { btn.disabled = false; btn.textContent = '修复'; }
  });
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>管理代码目录</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.6 "Microsoft YaHei", system-ui, sans-serif; background: #161b22; color: #c9d1d9; padding: 14px 16px;
    /* 20261120 用户裁定:窗口固定不可变尺寸——整页 flex 纵列,列表自缩滚动,添加按钮/错误行恒钉底不被挤占 */
    height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  h2 { font-size: 12px; color: #8b949e; font-weight: 600; margin: 0 0 6px; border-bottom: 1px solid #21262d; padding-bottom: 4px; flex: none; }
  .hint { color: #8b949e; font-size: 12px; margin-bottom: 10px; flex: none; }
  .list { display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .item { display: flex; align-items: center; gap: 8px; background: #0d1117; border: 1px solid #21262d; border-radius: 4px; padding: 6px 8px; flex: none; }
  .path { flex: 1; word-break: break-all; }
  .empty { color: #8b949e; padding: 12px 0; }
  .err { color: #d29922; font-size: 12px; margin-top: 8px; white-space: pre-wrap; flex: none; max-height: 72px; overflow-y: auto; }
  button {
    appearance: none; font: 12px/20px "Microsoft YaHei", system-ui, sans-serif;
    color: #c9d1d9; background: #21262d; border: 1px solid #30363d; border-radius: 4px;
    padding: 0 10px; cursor: pointer; flex: none;
  }
  button:hover:not(:disabled) { border-color: #58a6ff; color: #58a6ff; }
  button:disabled { opacity: 0.55; cursor: default; }
  .foot { margin-top: 12px; flex: none; }
</style>
</head>
<body>
  <h2>代码目录</h2>
  <p class="hint">这些目录是语义索引的范围。添加或移除只改目录列表。</p>
  <div class="list" id="list"></div>
  <div class="foot"><button type="button" id="add">添加目录</button></div>
  <p class="err" id="err"></p>
<script>
  const list = document.getElementById('list');
  const err = document.getElementById('err');
  const addBtn = document.getElementById('add');

  function show(res) {
    const roots = Array.isArray(res?.roots) ? res.roots : [];
    list.replaceChildren();
    if (!roots.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有代码目录';
      list.appendChild(empty);
    }
    for (const p of roots) {
      const row = document.createElement('div');
      row.className = 'item';
      const name = document.createElement('span');
      name.className = 'path';
      name.textContent = p;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '移除';
      btn.addEventListener('click', () => remove(p));
      row.append(name, btn);
      list.appendChild(row);
    }
    const notes = [];
    if (res && res.ok === false && res.error) notes.push(res.error);
    if (Array.isArray(res?.messages)) notes.push(...res.messages);
    err.textContent = notes.join('\n');
  }

  async function load() {
    show(await window.trayRoots.list());
  }

  async function remove(p) {
    addBtn.disabled = true;
    try { show(await window.trayRoots.remove(p)); }
    finally { addBtn.disabled = false; }
  }

  addBtn.addEventListener('click', async () => {
    addBtn.disabled = true;
    try { show(await window.trayRoots.add()); }
    finally { addBtn.disabled = false; }
  });

  load();
</script>
</body>
</html>
